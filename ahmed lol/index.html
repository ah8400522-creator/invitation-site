<!DOCTYPE html>
<TItle> janas's party</TItle>
<link rel="stylesheet" href="css/styl.css">
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invitation</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(rgba(255,182,193,0.7), rgba(255,105,180,0.7));
    font-family: Arial;
    overflow:hidden;
}

/* الصندوق */
.box, .text{
    background: rgba(255,255,255,0.2);
    padding: 50px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    text-align:center;
    opacity:1;
    transition: 0.7s;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background: hotpink;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background: deeppink;
    transform: scale(1.1);
}

.text{
    display:none;
    font-size:28px;
    color:rgb(216, 28, 144);
}

/* ✨ Animation Fade */
.fadeOut{
    opacity:0;
    transform: scale(0.9);
}
.fadeIn{
    animation: fadeIn 1s forwards;
}
@keyframes fadeIn{
    from{
        opacity:0;
        transform: scale(0.9);
    }
    to{
        opacity:1;
        transform: scale(1);
    }
}

/* 💖 قلوب */
.heart{
    position:absolute;
    color:pink;
    font-size:20px;
    animation: float 5s linear infinite;
}
@keyframes float{
    0%{
        transform: translateY(100vh);
        opacity:1;
    }
    100%{
        transform: translateY(-10vh);
        opacity:0;
    }
}
</style>

</head>
<body>

<!-- الصفحة الأولى -->
<div class="box" id="firstPage">
    <button onclick="showText()">Click here 💖</button>
</div>

<!-- الصفحة التانية -->
<div class="text" id="secondPage">
    You are invited to a janas's party 🎉
</div>

<!-- صوت -->
<audio id="sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=party-horn-112194.mp3"></audio>

<script>

// تغيير الصفحة
function showText(){
    let first = document.getElementById("firstPage");
    let second = document.getElementById("secondPage");

    first.classList.add("fadeOut");

    setTimeout(()=>{
        first.style.display = "none";
        second.style.display = "block";
        second.classList.add("fadeIn");
    },700);

    // تشغيل الصوت
    document.getElementById("sound").play();

    // إنشاء القلوب
    createHearts();
}

// 💖 قلوب متحركة
function createHearts(){
    setInterval(()=>{
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (15 + Math.random()*25) + "px";
        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },5000);
    },300);
}

</script>

</body>
</html>
